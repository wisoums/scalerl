# ScaleRL local full stack: Scenario Lab, trainer, MLflow, Optuna Dashboard,
# PostgreSQL metadata, and the S3-compatible artifact store (Garage).
#
#   cp .env.example .env
#   docker compose up --build
#
# Browser: ScaleRL http://localhost:8501 · MLflow http://localhost:5000 ·
# Optuna Dashboard http://localhost:8080. Local development/reproducibility
# only, not a hardened internet-facing deployment. See docs/DOCKER.md.

name: ${COMPOSE_PROJECT_NAME:-scalerl}

x-scalerl-image: &scalerl-image
  image: scalerl:local
  build:
    context: .
    dockerfile: Dockerfile

x-restart: &restart
  restart: unless-stopped

services:
  # --- ScaleRL -----------------------------------------------------------------

  scalerl-ui:
    <<: [*scalerl-image, *restart]
    init: true
    ports:
      - "${SCALERL_UI_PORT:-8501}:8501"
    environment:
      # Browser-facing URLs for later platform navigation (#59); never Docker DNS names.
      SCALERL_MLFLOW_UI_URL: ${SCALERL_MLFLOW_UI_URL:-http://localhost:5000}
      SCALERL_OPTUNA_DASHBOARD_URL: ${SCALERL_OPTUNA_DASHBOARD_URL:-http://localhost:8080}
    volumes:
      - ./data/raw:/app/data/raw:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # The Scenario Lab runs standalone: no dependency on MLflow or Optuna.

  trainer:
    <<: *scalerl-image
    # Utility container: `docker compose run --rm trainer <command>`.
    # Its profile keeps it out of `docker compose up`; it exits when the command ends.
    profiles: [trainer]
    init: true
    user: "${SCALERL_UID:-10001}:${SCALERL_GID:-10001}"
    command: ["python", "-c", "print('Usage: docker compose run --rm trainer <command>')"]
    environment:
      HOME: /tmp
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OPTUNA_STORAGE_URI: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/optuna
      SCALERL_MLFLOW_UI_URL: ${SCALERL_MLFLOW_UI_URL:-http://localhost:5000}
      SCALERL_OPTUNA_DASHBOARD_URL: ${SCALERL_OPTUNA_DASHBOARD_URL:-http://localhost:8080}
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./outputs:/app/outputs
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # --- Experiment tracking ------------------------------------------------------

  mlflow:
    <<: *restart
    image: scalerl-mlflow:3.16.1
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    command:
      - --host=0.0.0.0
      - --port=5000
      - --serve-artifacts
      # Clients reach it as mlflow:5000 (Compose DNS) or localhost:<port> (browser).
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    ports:
      - "${MLFLOW_UI_PORT:-5000}:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/mlflow
      # The server proxies artifact uploads/downloads, so ScaleRL clients need no S3 credentials.
      MLFLOW_ARTIFACTS_DESTINATION: s3://${MLFLOW_BUCKET:-mlflow}
      MLFLOW_S3_ENDPOINT_URL: http://garage:3900
      AWS_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?set GARAGE_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?set GARAGE_SECRET_ACCESS_KEY in .env}
      AWS_DEFAULT_REGION: garage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully

  optuna-dashboard:
    <<: *restart
    image: scalerl-optuna-dashboard:0.21.0
    build:
      context: .
      dockerfile: docker/optuna-dashboard/Dockerfile
    # The dashboard never creates tables, so first create/upgrade-check Optuna's schema
    # (idempotent) in case no study has run yet; then serve.
    command:
      - sh
      - -c
      - >-
        python -c "import os, optuna; optuna.storages.RDBStorage(os.environ['OPTUNA_STORAGE_URI'])"
        && exec optuna-dashboard --host 0.0.0.0 --port 8080 "$$OPTUNA_STORAGE_URI"
    ports:
      - "${OPTUNA_DASHBOARD_PORT:-8080}:8080"
    environment:
      # The same PostgreSQL database the trainer's Optuna studies use.
      OPTUNA_STORAGE_URI: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/optuna
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/meta', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # --- Storage (internal only: no host ports) -------------------------------------

  postgres:
    <<: *restart
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      # Creates the separate `mlflow` and `optuna` databases on first start.
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      # Over TCP, so it only passes once initialization has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d optuna"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  garage:
    <<: *restart
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # The image has no shell or curl; the Garage CLI checks the local node over RPC.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  garage-init:
    # One-shot: layout, S3 access key, and MLflow bucket. Idempotent on every `up`.
    image: python:3.12.14-slim-trixie
    command: ["python", "/init/garage_init.py"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?set GARAGE_ACCESS_KEY_ID in .env}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?set GARAGE_SECRET_ACCESS_KEY in .env}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
    volumes:
      - ./docker/garage/init.py:/init/garage_init.py:ro
    depends_on:
      garage:
        condition: service_healthy

volumes:
  postgres-data:
  garage-meta:
  garage-data:
