[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scalerl"
version = "0.1.0"
description = "Deep reinforcement learning for adaptive, cost-aware cloud autoscaling."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Wiâme Kotbi"}]
dependencies = [
  "gymnasium>=1.1,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "stable-baselines3>=2.4,<3",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.6,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]
mlops = [
  "mlflow>=3.16,<4",
]
dashboard = [
  "streamlit>=1.64,<2",
]
# PostgreSQL driver for SQLAlchemy stores (Optuna/MLflow in the Docker Compose stack).
postgres = [
  "psycopg[binary]>=3.2,<4",
]
# Tuning trials log through MLflow, so the tuning extra includes mlops.
tuning = [
  "optuna>=5,<6",
  "scalerl[mlops]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scalerl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# No python_version pin: each CI job checks against its own interpreter and numpy stubs.
strict = true
packages = ["scalerl"]

# pandas ships no type information; only the Azure loader uses it.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
