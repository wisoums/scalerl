name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        # mlops and dashboard are included so the MLflow and Streamlit tests actually run.
        run: python -m pip install --upgrade pip && pip install -e ".[dev,mlops,dashboard]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest --cov=scalerl --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Smoke-install built wheel
        run: |
          python -m venv /tmp/scalerl-wheel-smoke
          /tmp/scalerl-wheel-smoke/bin/pip install dist/*.whl
          /tmp/scalerl-wheel-smoke/bin/python -c "import scalerl"
          cd /tmp && /tmp/scalerl-wheel-smoke/bin/python -c "from scalerl.benchmarks import load_benchmark_manifest; load_benchmark_manifest()"
          # Installed without extras: core, scalerl.mlops, and scalerl.dashboard must import
          # without MLflow or Streamlit.
          cd /tmp && /tmp/scalerl-wheel-smoke/bin/python -c "import sys, scalerl.environment, scalerl.controllers, scalerl.benchmarks, scalerl.mlops, scalerl.dashboard; assert 'mlflow' not in sys.modules and 'streamlit' not in sys.modules"
